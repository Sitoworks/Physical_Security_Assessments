<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Physical Security Trainer Console</title>
<style>
:root{--bg:#f3f6fb;--card:#ffffff;--ink:#0b1f3a;--muted:#51627a;--line:#d9e2ef;--blue:#0067b8;--blue2:#005a9e;--navy:#0b2545;--cyan:#007c89;--ok:#0e7a3d;--warn:#9a5200;--bad:#b3283f;--okbg:#e4f4ea;--badbg:#fbe8ec;--warnbg:#fff1df;--soft:#eaf2fb;--shadow:0 1px 2px rgba(11,37,69,.06),0 6px 18px rgba(11,37,69,.07);--bar2:#00a3b4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09111f;--card:#101b2f;--ink:#e8eef8;--muted:#a3b3c9;--line:#24354f;--blue:#5aaeff;--blue2:#7bbcff;--navy:#0a1a33;--cyan:#45d0dc;--ok:#52c98d;--warn:#ffb454;--bad:#ff8196;--okbg:#10291e;--badbg:#321622;--warnbg:#2e2210;--soft:#14263f;--shadow:0 1px 2px rgba(0,0,0,.4);--bar2:#35c4d3}:root:not([data-theme="light"]) .primary,:root:not([data-theme="light"]) .tabs button.on{color:#06223f}}
:root[data-theme="dark"] .primary,:root[data-theme="dark"] .tabs button.on{color:#06223f}
:root[data-theme="dark"]{--bg:#09111f;--card:#101b2f;--ink:#e8eef8;--muted:#a3b3c9;--line:#24354f;--blue:#5aaeff;--blue2:#7bbcff;--navy:#0a1a33;--cyan:#45d0dc;--ok:#52c98d;--warn:#ffb454;--bad:#ff8196;--okbg:#10291e;--badbg:#321622;--warnbg:#2e2210;--soft:#14263f;--shadow:0 1px 2px rgba(0,0,0,.4);--bar2:#35c4d3}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100%}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:.4rem 0}a{color:var(--blue)}
.muted{color:var(--muted)}.small{font-size:.875rem}.center{text-align:center}
.top{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}.brand small{display:block;font-weight:400;opacity:.8;font-size:.78rem}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0078d4,#00b7c3);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:background .15s,transform .05s,border-color .15s}
button:hover,.btn:hover{border-color:var(--blue)}button:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover{background:var(--blue2);border-color:var(--blue2)}
.danger{color:var(--bad);border-color:var(--bad)}.ghost{background:transparent}
button[disabled]{opacity:.5;cursor:not-allowed}
.top button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);min-height:36px;padding:6px 12px}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=text],input[type=email],input[type=number],select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px}
textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:.82rem}
label.fl{display:block;font-weight:600;margin:10px 0 4px}
.hero{background:linear-gradient(135deg,var(--navy),#0b3d75);color:#fff;border:0}.hero p{opacity:.92}
.hero a{color:#9fd4ff}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:12px 0}
.tile{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--card);display:block;position:relative}
.tile input{position:absolute;opacity:0}.tile.on{border-color:var(--blue);background:var(--soft)}
.tile:focus-within{outline:3px solid var(--cyan)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.chip.B{background:var(--okbg);color:var(--ok)}.chip.I{background:var(--warnbg);color:var(--warn)}.chip.A{background:var(--badbg);color:var(--bad)}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--bar2));transition:width .25s}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin:10px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--blue)}.opt.sel{border-color:var(--blue);background:var(--soft)}.opt input{margin-top:4px;width:20px;height:20px;flex:none;accent-color:var(--blue)}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dot{min-width:38px;min-height:38px;padding:0;justify-content:center;font-size:.85rem}
.dot.ans{background:var(--soft);border-color:var(--blue)}.dot.flag{border-color:var(--warn);box-shadow:inset 0 -4px 0 var(--warn)}.dot.cur{background:var(--blue);color:#fff;border-color:var(--blue)}
.ring{display:block;margin:auto}.ring text{fill:var(--ink)}
.kpi{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.kpi b{display:block;font-size:1.6rem;line-height:1.1}.kpi span{color:var(--muted);font-size:.82rem}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-size:.9rem;width:100%;text-align:left;border:0;background:transparent;padding:2px 0;min-height:0}
.hb .tr{background:var(--line);border-radius:6px;height:16px;position:relative;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:6px;background:var(--blue)}.hb .tr i.b2{background:var(--bar2);margin-top:0}
.hb.two .tr{height:26px}.hb.two .tr i{height:12px;margin-bottom:2px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.hb:hover .lb{text-decoration:underline}
.vb{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:8px;border-bottom:1px solid var(--line)}
.vb .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;min-width:0}
.vb .c i{display:block;width:100%;max-width:60px;border-radius:6px 6px 0 0;background:var(--blue);min-height:2px}.vb .c i.b2{background:var(--bar2)}
.vb .c small{font-size:.72rem;color:var(--muted)}
.pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}.pair i{flex:1;max-width:28px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin:4px 0}.legend s{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;text-decoration:none;background:var(--blue)}.legend s.b2{background:var(--bar2)}.legend s.g3{background:#8a9bb3}
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--line)}.stack i{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.tbl tr.cl{cursor:pointer}.tbl tr.cl:hover{background:var(--soft)}.scroll{overflow-x:auto;max-width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tabs button{border-radius:999px;min-height:38px;padding:6px 14px}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.alert{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft)}.alert.w{background:var(--warnbg);border-color:var(--warn)}.alert.e{background:var(--badbg);border-color:var(--bad)}.alert.s{background:var(--okbg);border-color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(5,12,25,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto}
.modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:760px;width:100%;padding:18px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}#toast.show{opacity:1}
.rv{border-left:4px solid var(--line);padding:8px 12px;margin:10px 0}.rv.c{border-color:var(--ok)}.rv.w{border-color:var(--bad)}.rv.u{border-color:var(--warn)}
.sq{display:inline-block;width:18px;height:18px;border-radius:4px;margin:1px;background:var(--line)}.sq.c{background:var(--ok)}.sq.w{background:var(--bad)}.sq.u{background:var(--warn)}
.okt{color:var(--ok);font-weight:600}.badt{color:var(--bad)}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:600}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:.85em}
.sr{position:absolute;left:-9999px}
.only-print{display:none}
@media (max-width:560px){.wrap{padding:12px}.card{padding:14px}h1{font-size:1.35rem}.hb{grid-template-columns:90px 1fr 46px}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.noprint,#toast,.tabs,button{display:none!important}.only-print{display:block}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}.modal{display:none}.wrap{padding:0}:root{--bg:#fff;--card:#fff;--ink:#000;--muted:#333;--line:#bbb;--soft:#f2f2f2}}
</style>

<script>
const BANK={"meta": {"title": "Physical Security Risk Management, Critical Infrastructure Protection & Regulatory Compliance", "blurb": "A five-day practical programme for telecommunications and infrastructure security professionals covering physical security governance and risk methodology, layered asset protection, compliance and contractor governance, incident response and investigation, and operational resilience and performance reporting.", "disclaimer": "These assessments are course knowledge checks written for this class. They are not professional certification exams, do not confer ISO certification and do not constitute legal advice. Regulatory references should be validated against organisational policy and current regulator guidance."}, "domains": {"D1": {"name": "Day 1: Governance, Threats & Risk Methodology"}, "D2": {"name": "Day 2: Asset Protection & Loss Prevention"}, "D3": {"name": "Day 3: Compliance, Audit & Contractors"}, "D4": {"name": "Day 4: Incident Response & Investigation"}, "D5": {"name": "Day 5: Resilience, Reporting & Roadmap"}}, "pre": [{"id": "P01", "d": "D1", "df": "B", "t": "s", "q": "What is the main purpose of a physical security risk assessment?", "o": ["To identify threats and vulnerabilities and prioritise risks for treatment", "To select the CCTV brand and camera model that will be installed at every site", "To prove to regulators that no security incident can ever occur at a facility", "To replace the need for guards, access control and perimeter protection"]}, {"id": "P02", "d": "D1", "df": "B", "t": "s", "q": "Which of the following is a physical security activity rather than a cybersecurity activity?", "o": ["Inspecting perimeter fencing and lighting at a BTS site", "Running a penetration test against the corporate network", "Encrypting data stored on company laptops", "Applying software patches to servers"]}, {"id": "P03", "d": "D1", "df": "I", "t": "s", "q": "Which asset would normally sit in the highest criticality tier at a telecommunications site?", "o": ["Batteries and generators whose loss would directly interrupt service", "Office furniture and fittings inside the site administration cabin", "Hand tools and consumables kept in the maintenance store room", "Printed signage and notices displayed at the main gate"]}, {"id": "P04", "d": "D1", "df": "I", "t": "s", "q": "In a basic physical security risk model, how is the level of a risk usually derived?", "o": ["By combining the likelihood of an event with the consequence if it occurs", "By adding up the number of cameras and guards deployed at the facility", "By multiplying the age of the asset by the number of staff on the roster", "By measuring the distance from the site to the nearest police station"]}, {"id": "P05", "d": "D1", "df": "I", "t": "m", "q": "Select TWO valid ways of treating a physical security risk.", "o": ["Reduce it by adding or improving controls", "Transfer part of it through insurance or contract terms", "Conceal it from management so it is not recorded", "Wait until an incident happens before deciding"]}, {"id": "P06", "d": "D1", "df": "A", "t": "s", "q": "Which statement about inherent and residual risk is correct?", "o": ["Inherent risk is assessed before controls; residual risk is what remains after controls", "Inherent risk is what remains after controls; residual risk is assessed before controls", "Both terms describe the same figure and are used interchangeably in a risk register", "Residual risk is the level of risk that the regulator has formally approved for the site"]}, {"id": "P07", "d": "D2", "df": "B", "t": "s", "q": "What does 'defence in depth' mean in physical security?", "o": ["Using layered, mutually reinforcing controls so that one failure does not expose the asset", "Relying on one very strong perimeter wall that no intruder could realistically breach", "Placing every available guard at the main gate so that all approaches are covered", "Moving every valuable asset into a single store room that is heavily protected"]}, {"id": "P08", "d": "D2", "df": "B", "t": "s", "q": "What does CPTED stand for?", "o": ["Crime Prevention Through Environmental Design", "Corporate Protection Through Enhanced Detection", "Critical Perimeter Threat Evaluation Document", "Controlled Premises and Territorial Entry Directive"]}, {"id": "P09", "d": "D2", "df": "I", "t": "s", "q": "Which of the following is an example of physical access control?", "o": ["Issuing zone-based badges and keeping a register of contractor permits", "Increasing the size of the diesel tank so the generator runs for longer", "Painting the equipment shelter a lighter colour to reflect heat from the sun", "Adding a second air-conditioning unit to keep the equipment cool at night"]}, {"id": "P10", "d": "D2", "df": "I", "t": "s", "q": "Which control would best help detect fuel siphoning at a remote site overnight?", "o": ["Remote fuel-level monitoring that raises an alert on unexplained drops", "Repainting the generator enclosure in a colour that matches the compound wall", "Adding a second visitor logbook at the gate so entries can be cross-checked", "Enlarging the lettering on the warning signs displayed around the site"]}, {"id": "P11", "d": "D2", "df": "I", "t": "m", "q": "Select TWO things a CCTV coverage review should check.", "o": ["Whether blind spots exist around entry points and restricted areas", "Whether night-time image quality is adequate at critical points", "The colour of the camera housings", "The number of staff on the next shift roster"]}, {"id": "P12", "d": "D2", "df": "A", "t": "s", "q": "In the Deter, Detect, Delay and Respond model, how should the time provided by delay measures compare with the time response takes?", "o": ["Delay should be longer than the time needed for an effective response", "Delay should be shorter than the response time so intruders are caught moving", "Delay and response are unrelated and can be designed separately", "Delay should equal the time needed to detect the intrusion"]}, {"id": "P13", "d": "D3", "df": "B", "t": "s", "q": "Which body is the primary regulator of private guard companies in Nigeria?", "o": ["Nigeria Security and Civil Defence Corps", "Nigerian Communications Commission (NCC)", "Independent Corrupt Practices Commission (ICPC)", "National Identity Management Commission (NIMC)"]}, {"id": "P14", "d": "D3", "df": "B", "t": "s", "q": "What is a security audit?", "o": ["A formal, evidence-based evaluation of controls against defined criteria", "An informal walk around the site that is recorded without any set criteria", "An investigation triggered by one specific theft or break-in at a site", "A financial review of the guard company's invoices and payment terms"]}, {"id": "P15", "d": "D3", "df": "I", "t": "s", "q": "What should a client do before contracting a private guard company?", "o": ["Verify its NSCDC licence and document that the check was done", "Accept a verbal assurance from the company that it is properly licensed", "Choose the lowest-priced bidder and check the licensing position later", "Skip checks if the company already guards another nearby site"]}, {"id": "P16", "d": "D3", "df": "I", "t": "s", "q": "What does CAPA stand for in audit follow-up?", "o": ["Corrective and Preventive Action", "Compliance and Policy Approval Procedure", "Corrective Alarm Protocol Assessment", "Control and Perimeter Access Audit"]}, {"id": "P17", "d": "D3", "df": "I", "t": "m", "q": "Select TWO good practices for managing CCTV recordings.", "o": ["Restrict footage access to authorised people and keep an access log", "Define a retention period and delete footage securely when it expires", "Share footage on social media to identify suspects quickly", "Keep all footage indefinitely in case it is needed one day"]}, {"id": "P18", "d": "D3", "df": "A", "t": "s", "q": "When should an audit non-conformance be closed?", "o": ["When the corrective action is complete and verified as effective", "As soon as the finding has been reported to management in writing", "When the contractor gives a verbal promise that the issue will be fixed", "At the end of the audit visit, whatever the status of the finding"]}, {"id": "P19", "d": "D4", "df": "B", "t": "s", "q": "In a physical security incident, what is the first priority?", "o": ["Protecting life and the safety of people", "Recovering the stolen assets before the thieves can move them", "Preserving the CCTV footage for the later investigation", "Informing the media and customers about what has happened"]}, {"id": "P20", "d": "D4", "df": "B", "t": "s", "q": "Why should the scene of a theft or break-in be left undisturbed until investigators arrive?", "o": ["To protect physical evidence from being lost or contaminated", "To keep the site looking normal for visitors and the community", "To allow the cleaning contractor to be scheduled for the next day", "To avoid having to complete the incident log after investigators leave"]}, {"id": "P21", "d": "D4", "df": "I", "t": "s", "q": "What is a chain of custody?", "o": ["A record of who collected, handled and stored evidence, and when", "The reporting line from the guard supervisor up to the security director", "The list of guards assigned to each shift at the site", "A contract clause setting out penalties for guard underperformance"]}, {"id": "P22", "d": "D4", "df": "I", "t": "s", "q": "Why are security incidents classified by severity?", "o": ["To trigger proportionate and timely escalation", "To decide which guards receive bonuses", "To avoid reporting minor incidents at all", "To meet the guard vendor's invoicing requirements"]}, {"id": "P23", "d": "D4", "df": "I", "t": "s", "q": "Which of the following is a fact rather than an assumption?", "o": ["The access log shows the shelter door opened at 02:14", "The guard on duty must have helped the thieves to gain entry", "The contractor was probably responsible for the missing batteries", "The thieves obviously came from the nearby community"]}, {"id": "P24", "d": "D4", "df": "A", "t": "s", "q": "Two guards give conflicting accounts of an incident. What is the best approach?", "o": ["Interview them separately and compare both statements with logs and CCTV", "Accept the version given by the more senior guard and close the matter", "Discard both statements because they conflict and rely on assumptions", "Interview them together until they agree on a single account"]}, {"id": "P25", "d": "D5", "df": "B", "t": "s", "q": "Which of the following is a leading indicator?", "o": ["Patrol compliance rate", "Value of assets stolen last quarter", "Number of incidents recorded last month", "Count of repeat breaches at one site"]}, {"id": "P26", "d": "D5", "df": "B", "t": "s", "q": "Which standard specifies requirements for a business continuity management system?", "o": ["ISO 22301", "ISO 31000", "ISO 45001", "ISO 18788"]}, {"id": "P27", "d": "D5", "df": "I", "t": "s", "q": "What does a key risk indicator (KRI) provide?", "o": ["An early warning that risk exposure is rising", "A guarantee that all performance targets will be met", "A formal certificate confirming compliance with a standard", "A staffing roster showing guard shifts for each site"]}, {"id": "P28", "d": "D5", "df": "I", "t": "s", "q": "Why can security risk increase during service recovery after an incident?", "o": ["Restoration work increases site activity and may leave equipment exposed", "Guards are legally required to leave a site once recovery work starts", "Recovery work always reduces the number of people present on the site", "Insurance rules forbid any physical protection while recovery is under way"]}, {"id": "P29", "d": "D5", "df": "I", "t": "s", "q": "What best describes a 90-day physical security improvement roadmap?", "o": ["A time-bound plan with prioritised actions, named owners and timelines", "A list of every incident recorded across all sites in the past year", "A budget approved by leadership without reference to the risk register", "A rota showing guard shifts and patrol schedules for the next quarter"]}, {"id": "P30", "d": "D5", "df": "A", "t": "s", "q": "Why should a security budget request be risk-based?", "o": ["Each item links to the risk it addresses and the residual risk it reduces", "It lets the team simply repeat last year's spending without justification", "It ensures the newest security technology is always purchased first", "It avoids having to name owners or completion dates for each action"]}], "post": [{"id": "Q01", "d": "D1", "df": "B", "t": "s", "q": "Under the three lines of responsibility model, who sits in the first line?", "o": ["Site managers and security officers who run controls daily", "Internal audit, which gives independent assurance on all controls", "The Corporate Security Manager and Risk and Compliance teams", "Executive leadership overseeing the whole security programme"]}, {"id": "Q02", "d": "D1", "df": "B", "t": "s", "q": "Which activity is within the scope of physical security as taught in this programme?", "o": ["Managing guard patrols and access control at facilities", "Managing encryption keys used to protect corporate databases", "Scanning applications for software vulnerabilities each week", "Performing digital forensics on a compromised application server"]}, {"id": "Q03", "d": "D1", "df": "I", "t": "s", "q": "A site assessment records frequent battery theft, broken perimeter fencing and high downtime costs. Which item is the vulnerability?", "o": ["The broken perimeter fencing", "The theft of batteries", "The cost of downtime", "The resale value of batteries"]}, {"id": "Q04", "d": "D1", "df": "I", "t": "m", "q": "Select TWO indicators that may point to an insider threat.", "o": ["Assets leaving site with no supporting documentation", "Repeated access outside working hours with no work order", "Guard patrol logs completed on schedule", "Visitors signing in with identification at reception"]}, {"id": "Q05", "d": "D1", "df": "I", "t": "s", "q": "An operator buys insurance cover for generator theft losses at remote sites. Which risk treatment is this?", "o": ["Transfer", "Avoid", "Reduce", "Accept"]}, {"id": "Q06", "d": "D1", "df": "I", "t": "s", "q": "Which three items must every risk in the register have?", "o": ["An assigned owner, a treatment decision and a target review date", "A photograph, a vendor name and a total count of installed cameras", "A budget line, a guard name and a patrol route for the site", "A regulator reference, a ticket number and a site code for the risk"]}, {"id": "Q07", "d": "D1", "df": "A", "t": "s", "q": "After controls are applied, a risk's residual level is still above the organisation's appetite. What is the correct next step?", "o": ["Escalate it to management for further treatment or a formal acceptance decision", "Lower the likelihood score until the residual rating fits within the appetite", "Remove it from the register so the report shows only manageable risks", "Leave it unchanged until an incident confirms that the rating was correct"]}, {"id": "Q08", "d": "D1", "df": "B", "t": "s", "q": "Why are assets placed into criticality tiers?", "o": ["So protection is concentrated on assets whose loss would cause the greatest harm", "So every asset in the inventory receives an identical level of protection", "So low-value assets are never recorded in the inventory, saving effort", "So insurers can set the price of the guard contract for each site"]}, {"id": "Q09", "d": "D1", "df": "A", "t": "s", "q": "Which sequence best matches a threat-led physical site survey?", "o": ["Prepare from site history, assess perimeter and zoning, review access control, then document and prioritise findings", "Write the report first, then visit the site briefly to collect evidence that supports its conclusions", "Start with the guard roster, then decide which threats might exist and inspect nothing else", "Inspect only the equipment shelter in detail, then close the survey and file a short note"]}, {"id": "Q10", "d": "D1", "df": "A", "t": "s", "q": "A new CCTV system was bought before any security policy or accountabilities were agreed. Which principle does this breach?", "o": ["Technology should serve agreed governance, so policy and accountability come first", "Security technology should be chosen first so that policy can be written around it", "Governance matters only for guard contracts, not for purchases such as cameras", "Accountability can be assigned after a system has been in service for a year"]}, {"id": "Q11", "d": "D2", "df": "B", "t": "s", "q": "What does natural surveillance mean in CPTED?", "o": ["Designing the site so activity is easy to see, using clear sightlines and lighting", "Hiding cameras carefully so that intruders cannot work out where they are", "Monitoring staff with covert recording equipment installed in work areas", "Removing all lighting at night so that intruders are not drawn to the site"]}, {"id": "Q12", "d": "D2", "df": "B", "t": "s", "q": "Which of these is a 'Delay' measure in the Deter, Detect, Delay and Respond model?", "o": ["Reinforced fencing, locks and security zoning", "Visible warning signs and lighting at the entrance", "Intrusion sensors linked to an alarm panel and the SOC", "Notifying law enforcement and the security operations centre"]}, {"id": "Q13", "d": "D2", "df": "I", "t": "s", "q": "When a contractor's contract ends, what should happen to their site access?", "o": ["Badges, keys and permits should be revoked promptly", "Access can stay active in case the contractor is rehired later", "Access should continue until the next annual access review", "The badge should be reissued to another contractor on the team"]}, {"id": "Q14", "d": "D2", "df": "I", "t": "s", "q": "Which approach best counters tailgating at a controlled entrance?", "o": ["One-person-at-a-time entry with badge verification and staff awareness", "Propping the door open during busy periods so people can pass quickly", "Allowing a known colleague to follow in without presenting a badge", "Posting a notice asking visitors to be polite when using the entrance"]}, {"id": "Q15", "d": "D2", "df": "I", "t": "m", "q": "Select TWO controls that protect a battery bank.", "o": ["A locked battery room with restricted key access and a key register", "Tamper-evident seals with regular reconciliation against the asset register", "Leaving the cabinet unlocked for maintenance convenience", "Recording battery counts once at purchase and never again"]}, {"id": "Q16", "d": "D2", "df": "I", "t": "s", "q": "Fuel deliveries to remote sites are repeatedly short, and collusion between guards and suppliers is suspected. Which combination most directly addresses this?", "o": ["Dual-authorisation of fuel deliveries with remote fuel-level telemetry", "More warning signs placed on the fuel tank and around the generator", "New uniforms and identification cards issued to the guards on site", "Painting the fuel tank a brighter colour so it can be seen from the gate"]}, {"id": "Q17", "d": "D2", "df": "I", "t": "s", "q": "What is the purpose of a CCTV field-of-view review?", "o": ["To find blind spots and obstructions and decide where cameras need to move", "To reduce the amount of footage that must be stored for each camera", "To choose the colour and finish of the camera housings at each site", "To rate individual guards on how quickly they complete their patrols"]}, {"id": "Q18", "d": "D2", "df": "A", "t": "s", "q": "An intruder is expected to complete the task in about 6 minutes, but guard response takes about 14 minutes. What does this show?", "o": ["A design gap: delay must be increased or response time reduced", "The design is adequate because the detection system works reliably", "The gap is acceptable provided a camera records the intruder on video", "Response time does not matter once intrusion alarms are installed"]}, {"id": "Q19", "d": "D2", "df": "A", "t": "s", "q": "An alarm sounds at a BTS site at 02:00 and the SOC sees it, but nobody is dispatched because the escalation path was never documented. Which assurance activity addresses this?", "o": ["Defining and testing the alarm response workflow from sensor to SOC to guards", "Replacing the intrusion sensors with a different brand that has more features", "Increasing the retention period used for stored CCTV footage on the system", "Repainting the perimeter fence and clearing vegetation along the boundary"]}, {"id": "Q20", "d": "D2", "df": "I", "t": "s", "q": "What is the purpose of natural access control in CPTED?", "o": ["To use fencing, gates and signage to guide legitimate users and channel intruders to detection points", "To remove physical barriers so that staff and visitors can move freely across the whole site", "To replace guards and cameras completely with landscaping and planting around the compound", "To leave all entrances unmarked so that every visitor has to ask staff for directions"]}, {"id": "Q21", "d": "D3", "df": "B", "t": "s", "q": "Under the Nigeria Data Protection Act 2023, how should CCTV footage be treated?", "o": ["As personal data that must be handled lawfully", "As public information that anyone may request to view", "As the property of the guard company that installed it", "As exempt from the retention and access rules in the Act"]}, {"id": "Q22", "d": "D3", "df": "B", "t": "s", "q": "What should be displayed at entry points where CCTV is in use?", "o": ["A clear notice informing people that they are being recorded", "The guard company's rate card and contract renewal dates", "The administrator password for the recording system, for staff reference", "A list of the cameras' serial numbers and installation dates"]}, {"id": "Q23", "d": "D3", "df": "I", "t": "s", "q": "How does a security audit differ from an inspection?", "o": ["An audit is formal and evidence-based against criteria; an inspection is a less formal review of physical conditions", "They are identical terms for the same activity, used differently by different teams in the organisation", "An inspection produces graded findings against criteria, while an audit has no defined criteria", "An audit is triggered only by a specific incident, while an inspection is always routine and informal"]}, {"id": "Q24", "d": "D3", "df": "I", "t": "s", "q": "Which sequence matches the security audit cycle?", "o": ["Plan the audit, collect evidence, identify findings, classify them, then report", "Report to management, plan the audit, classify, collect evidence, identify findings", "Collect evidence, report, plan, classify findings, identify further findings", "Classify, plan, report, identify findings, collect evidence for the report"]}, {"id": "Q25", "d": "D3", "df": "I", "t": "s", "q": "How should a critical non-conformance found during an audit be handled?", "o": ["It should be escalated immediately", "It should wait for the monthly CAPA review", "It should be treated as a minor finding", "It should be closed once recorded"]}, {"id": "Q26", "d": "D3", "df": "I", "t": "m", "q": "Select TWO correct statements about CAPA.", "o": ["Corrective actions address the specific finding and are verified before closure", "Preventive actions target the root cause so the issue does not recur", "A CAPA entry is complete once an owner is named, even if no action is taken", "Preventive actions are only ever needed for critical findings"]}, {"id": "Q27", "d": "D3", "df": "I", "t": "s", "q": "When should a client verify a guard provider's NSCDC licence?", "o": ["At contract start and at each annual renewal, with each check documented", "Only after a serious incident involving the guards has occurred at a site", "Never, because the guard company is solely responsible for its own licence", "Only when the quoted price seems unusually high compared with other bids"]}, {"id": "Q28", "d": "D3", "df": "I", "t": "s", "q": "Which content belongs in site post orders for guards?", "o": ["Site-specific duties, patrol routes and frequency, access procedures and reporting triggers", "The guard company's marketing material, brochures and a list of its other clients", "Salary details and payroll information for each guard employed by the vendor", "A generic code of conduct that contains no site-specific instructions at all"]}, {"id": "Q29", "d": "D3", "df": "A", "t": "s", "q": "A guard contractor's SLA data shows 78% patrol compliance against a 95% target for three consecutive months. What is the best response?", "o": ["Escalate through formal contract mechanisms and require a tracked corrective plan", "Wait another full quarter in case performance improves without any intervention", "Pay a performance bonus to encourage the contractor to improve its patrol compliance", "Terminate the contract at once without following the contract's own process"]}, {"id": "Q30", "d": "D3", "df": "A", "t": "s", "q": "A manager asks to send CCTV footage of a staff member to an outside party through a messaging app. What is the correct response?", "o": ["Decline unless a documented legal basis exists and the release is authorised and logged", "Send it, because the requesting manager has full authority over the site and staff", "Send it, but only after blurring the background and other people in the frame", "Send it, provided the clip is short and the recipient promises to delete it"]}, {"id": "Q31", "d": "D4", "df": "B", "t": "s", "q": "Under the incident severity matrix taught in the course, which incident is High (P2)?", "o": ["Confirmed generator theft", "An armed attack on a site", "A gap in the patrol log", "An unverified access attempt"]}, {"id": "Q32", "d": "D4", "df": "B", "t": "s", "q": "How should a Critical (P1) incident be escalated?", "o": ["Immediately to senior leadership, the Security Director and law enforcement", "Within four hours, to the Security Supervisor and the Facilities Manager", "At the next scheduled security review meeting, with the standard monthly report", "Only if the media or a customer asks about the incident afterwards"]}, {"id": "Q33", "d": "D4", "df": "I", "t": "s", "q": "Which of the following is an early-warning indicator of a possible incident?", "o": ["Sudden unexplained drops in fuel or battery levels", "Patrol logs that have been completed on time at every checkpoint", "Scheduled maintenance carried out on time by the vendor", "A regular visitor signing in as usual with valid identification"]}, {"id": "Q34", "d": "D4", "df": "I", "t": "s", "q": "In which order should a first responder prioritise actions at an incident scene?", "o": ["People first, then the scene, then information", "Assets first, then the scene, then the people involved", "Information first, then people, then the scene itself", "The scene first, then assets, then the people affected"]}, {"id": "Q35", "d": "D4", "df": "I", "t": "s", "q": "Why should access to CCTV footage be restricted immediately after an incident?", "o": ["To protect the integrity of the evidence and preserve the chain of custody", "To save recording storage space on the system during the investigation", "To prevent guards from learning what happened until investigators arrive", "To allow the footage to be overwritten sooner by the recording system"]}, {"id": "Q36", "d": "D4", "df": "I", "t": "m", "q": "Select TWO good practices when taking witness statements.", "o": ["Interview witnesses separately and promptly", "Note contradictions rather than dismissing them", "Interview witnesses together so they agree on one story", "Rewrite statements to remove inconsistencies"]}, {"id": "Q37", "d": "D4", "df": "I", "t": "s", "q": "Which of the following is a root-cause analysis technique?", "o": ["Fishbone (Ishikawa) analysis", "Balanced scorecard reporting", "Gantt chart scheduling", "PESTLE environmental scanning"]}, {"id": "Q38", "d": "D4", "df": "A", "t": "s", "q": "During an incident at a BTS shelter, calls go to many people and nobody is directing the response. Which preparedness element is missing?", "o": ["A designated incident commander with defined command and escalation routes", "A larger storage capacity for the CCTV recording system at the site", "A new set of guard uniforms with the company logo and ID badges", "A revised visitor sign-in sheet with extra columns for vehicle details"]}, {"id": "Q39", "d": "D4", "df": "A", "t": "s", "q": "Early in an investigation the team decides the contractor must be responsible and stops reviewing access logs. Which principle has been breached?", "o": ["Assumptions must be labelled unconfirmed and must not steer the investigation", "Investigations should always start with the person management considers most likely", "Logs should only be reviewed after the team has reached a firm conclusion", "Evidence is optional whenever two or more witnesses agree on what occurred"]}, {"id": "Q40", "d": "D4", "df": "A", "t": "s", "q": "What is the appropriate way to engage law enforcement during a criminal security incident?", "o": ["Engage early, give factual briefings, avoid speculation and keep a written record", "Wait until the internal investigation has been fully completed and signed off", "Share the team's working assumptions so that the police can move faster", "Avoid keeping any written record of the interaction to protect confidentiality"]}, {"id": "Q41", "d": "D5", "df": "B", "t": "s", "q": "Which of these is a lagging indicator?", "o": ["Number of security incidents per site per month", "Guard training completion rate across the contracted workforce", "Patrol compliance rate measured against the scheduled patrols", "CCTV system uptime measured over the reporting period"]}, {"id": "Q42", "d": "D5", "df": "B", "t": "s", "q": "Which items should be documented, rehearsed and known to all site personnel, including contractors?", "o": ["Evacuation, shelter and personnel accountability arrangements", "Vendor price lists and discount schedules for security equipment", "Furnishing and decoration standards for site cabins and shelters", "Marketing messages and branding guidelines for each site"]}, {"id": "Q43", "d": "D5", "df": "I", "t": "s", "q": "How is patrol compliance rate calculated?", "o": ["Completed patrols divided by scheduled patrols, multiplied by 100", "Scheduled patrols divided by completed patrols, multiplied by 100", "Total incidents recorded divided by the total number of patrols", "Number of guards on duty divided by the number of sites covered"]}, {"id": "Q44", "d": "D5", "df": "I", "t": "s", "q": "How is the repeat breach rate described in the course KPI and KRI examples?", "o": ["Sites with two or more incidents in 90 days as a percentage of total sites", "Total incidents recorded divided by the number of guards employed", "Number of patrols completed per site per week across the estate", "Incidents recorded in the most recent month only, shown as a percentage"]}, {"id": "Q45", "d": "D5", "df": "I", "t": "m", "q": "Select TWO items that belong on an executive security dashboard.", "o": ["The top three to five risks needing leadership attention", "Trend indicators showing improving, stable or deteriorating positions", "Every line of every patrol log", "Raw CCTV footage from each site"]}, {"id": "Q46", "d": "D5", "df": "I", "t": "s", "q": "How should improvement actions be prioritised in a risk-based plan?", "o": ["By residual risk score, giving the highest-risk gaps first call on budget and timelines", "Alphabetically by site name so the plan is easy to follow and update", "Cheapest actions first, regardless of how much risk each action removes at a site", "By the seniority of the manager who proposed each action in the plan"]}, {"id": "Q47", "d": "D5", "df": "I", "t": "s", "q": "What does mean alarm response time measure?", "o": ["The average time from alarm trigger to a guard being on site", "The average time between the start and end of each guard shift", "The time taken to repair a faulty intrusion sensor after it fails", "The delay between a purchase order and delivery of new cameras"]}, {"id": "Q48", "d": "D5", "df": "A", "t": "s", "q": "A dashboard shows 99% patrol compliance, yet repeat breaches keep rising. What is the most sensible conclusion?", "o": ["Activity metrics may not show control effectiveness, so patrol quality and outcomes need review", "The breach data must be inaccurate because patrol compliance is reported as so high", "The patrol compliance target should simply be raised to 100% with no other changes", "Repeat breaches are unrelated to guard performance and cannot be improved by patrol quality"]}, {"id": "Q49", "d": "D5", "df": "A", "t": "s", "q": "Which information should a risk-based security budget submission include?", "o": ["The risk addressed, control gap, proposed control, cost, expected risk reduction, owner and completion date", "Only the total cost of the proposed purchase, the supplier name and delivery lead time", "A vendor brochure, a quotation and a comparison with competing products, with no link to risk", "A headcount list for the security department, overtime hours and a summary of leave taken"]}, {"id": "Q50", "d": "D5", "df": "A", "t": "s", "q": "What does formal acceptance of residual risk require?", "o": ["A documented decision by an accountable owner within appetite, with ongoing monitoring", "A verbal agreement among the guards on the shift responsible for the site", "Removal of the risk from the register as soon as it has been accepted by anyone", "No record at all, because accepted risks need no follow-up or periodic review"]}]};

// ===== Core helpers (hashing, shuffling, grading, result codes) =====
function sha256(str){const msg=unescape(encodeURIComponent(str)),len=msg.length,nW=(((len+8)>>6)+1)*16,w=new Array(nW).fill(0);
for(let i=0;i<len;i++)w[i>>2]|=msg.charCodeAt(i)<<(24-(i%4)*8);w[len>>2]|=0x80<<(24-(len%4)*8);w[nW-1]=len*8;
const K=[],H=[];let n=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
for(let c=2;n<64;c++)if(isP(c)){if(n<8)H[n]=(Math.pow(c,.5)%1)*4294967296|0;K[n]=(Math.pow(c,1/3)%1)*4294967296|0;n++}
const R=(x,r)=>(x>>>r)|(x<<(32-r));
for(let o=0;o<nW;o+=16){const W=w.slice(o,o+16);for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];W[i]=(W[i-16]+(R(a,7)^R(a,18)^(a>>>3))+W[i-7]+(R(b,17)^R(b,19)^(b>>>10)))|0}
let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
const hOpt=(id,t)=>sha256(id+"|"+t+"|"+SALT).slice(0,16);
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DOM=Object.keys(BANK.domains),QMAP={};["pre","post"].forEach(t=>BANK[t].forEach(q=>QMAP[q.id]=q));
const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," "),normId=s=>String(s||"").trim().toLowerCase().replace(/\s+/g,"");
function gradeQ(q,sel){if(!sel||!sel.length)return"u";const k=KEYS[q.id],hs=sel.map(t=>hOpt(q.id,t)),right=hs.filter(h=>k.includes(h)).length;return(right===k.length&&hs.length===k.length)?"c":"w"}
const gradeAttempt=a=>BANK[a.type].map(q=>gradeQ(q,a.answers[q.id])).join("");
const pct=r=>r&&r.m?Math.round(r.p/r.m*1000)/10:0;
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
function buildRecord(type,L,qs,t0,t1,extra){const bank=BANK[type],tp={};DOM.forEach(d=>tp[d]=[0,0]);let c=0,w=0,u=0;
bank.forEach((q,i)=>{const ch=qs[i];tp[q.d][1]++;if(ch==="c"){tp[q.d][0]++;c++}else if(ch==="w")w++;else u++});
return Object.assign({type,n:L.name,i:L.lid||"",nk:norm(L.name),s:new Date(t1).toISOString(),p:c,m:bank.length,c,w,u,d:Math.max(0,Math.round((t1-t0)/1000)),tp,qs},extra||{})}
function encodeCode(r){const p=b64e(JSON.stringify({v:1,t:r.type,n:r.n,i:r.i,s:r.s,p:r.p,m:r.m,u:r.u,d:r.d,q:r.qs}));return"PSRM."+p+"."+sha256(p+SECRET).slice(0,10)}
function decodeCode(code){try{const parts=String(code).trim().split(".");if(parts.length!==3||parts[0]!=="PSRM")return{ok:false,err:"Not a valid result code for this course"};
if(sha256(parts[1]+SECRET).slice(0,10)!==parts[2])return{ok:false,err:"Signature check failed (code altered or incomplete)"};
const o=JSON.parse(b64d(parts[1]));if(o.t!=="pre"&&o.t!=="post")return{ok:false,err:"Unknown assessment type"};
const bank=BANK[o.t];if(typeof o.q!=="string"||o.q.length!==bank.length||!/^[cwu]+$/.test(o.q))return{ok:false,err:"Question data does not match this assessment"};
if(typeof o.n!=="string"||!o.n.trim()||o.n.length>80)return{ok:false,err:"Invalid learner name"};
const r=buildRecord(o.t,{name:o.n,lid:o.i},o.q,0,0,{});r.s=o.s;r.d=o.d|0;if(isNaN(Date.parse(o.s)))return{ok:false,err:"Invalid timestamp"};
if(r.p!==o.p||r.u!==o.u)return{ok:false,err:"Score does not match answers"};r.rid=parts[2];r.src="import";return{ok:true,rec:r}}catch(e){return{ok:false,err:"Could not read code"}}}

const t1=Date.now(),qs=gradeAttempt(a),rec=buildRecord(a.type,{name:a.name,lid:a.lid},qs,a.started,t1,{src:"device"});rec.code=encodeCode(rec);rec.rid=rec.code.split(".")[2];
const all=ls.get(REC,[]);if(!all.some(r=>r.rid===rec.rid)){all.push(rec);ls.set(REC,all)}ls.del(draftKey(a));const ob=outbox();if(!ob.some(x=>x.rid===rec.rid)){ob.push({rid:rec.rid,code:rec.code});ls.set(OUT,ob)}S.result=rec;S.screen="results";S.confirm=false;S.send=null;render();sendResult(rec)}
function findPre(rec){const pre=ls.get(REC,[]).filter(r=>r.type==="pre"&&same(r,rec)).sort((a,b)=>a.s<b.s?1:-1);return pre[0]||null}

return`<section class="card center"><h1>${tName(r.type)} complete</h1><p>Thank you, ${esc(r.n)}. Your submission has been recorded and scored.</p>${ring(p,180,"Total score")}<p style="font-size:1.15rem;margin-top:8px"><b>${r.p} / ${r.m}</b> points &middot; <b>${f1(p)}%</b></p>

${cmp?`<section class="card">${cmp}</section>`:""}

<div><h3 class="warn">Areas to improve</h3>${weak.length?`<ul>${weak.map(x=>`<li>${esc(x.name)} (${f1(x.p)}%)</li>`).join("")}</ul>`:'<p class="small muted">All topics are at or above the benchmark.</p>'}</div></div></section>

// ===== Google Sheet backend (Google Apps Script web app) =====
const apiOk=()=>/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(CONFIG.sheetUrl);
async function api(payload,ms){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||25000);
try{const r=await fetch(CONFIG.sheetUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),signal:ctl.signal,redirect:"follow"});
if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
async function loadRemoteConfig(){if(!apiOk())return;const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
try{const r=await fetch(CONFIG.sheetUrl+"?action=config",{signal:ctl.signal,redirect:"follow"}),j=await r.json();
if(j&&j.ok&&j.config){const c=j.config;["preOpen","postOpen","showExplanations","allowRetake"].forEach(k=>{if(typeof c[k]==="boolean")CONFIG[k]=c[k]});
if(typeof c.benchmark==="number"&&c.benchmark>=0&&c.benchmark<=100){CONFIG.benchmark=c.benchmark;if(CONFIG.trainerBuild){const s=ls.get(SET,{});s.benchmark=c.benchmark;ls.set(SET,s)}}
if(S.screen==="welcome"&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||""))render(true);else if(S.screen==="trainer")render(true)}}
catch(e){}finally{clearTimeout(t)}}

// ===== Trainer sign-in and Google Sheet sync (password is checked by the Apps Script, never stored in this page) =====
const skey=()=>{try{return sessionStorage.getItem("psrm.tk")||""}catch(e){return""}};
const setkey=v=>{try{v?sessionStorage.setItem("psrm.tk",v):sessionStorage.removeItem("psrm.tk")}catch(e){}};
async function doLogin(silent){const el=$("#pw"),pw=silent?skey():(el?el.value:"");
if(!pw){S.loginErr="Enter the trainer password.";return render(true)}
if(!apiOk()){S.loginErr="This page is not connected to a Google Apps Script yet. Check config.js (see the README).";S.ownerKnown=true;return render(true)}
S.loggingIn=true;S.loginErr="";if(!silent)render(true);
try{const r=await api({action:"results",key:pw});
if(r&&r.ok){S.key=pw;setkey(pw);S.isOwner=true;S.ownerKnown=true;S.loggingIn=false;applyResults(r);render();return}
S.isOwner=false;S.key="";setkey("");S.loginErr=(r&&r.error)||"Sign-in failed."}
catch(e){S.isOwner=false;S.loginErr=silent?"":"Could not reach the Google Apps Script. Check your internet connection and the web app URL in config.js."}
S.ownerKnown=true;S.loggingIn=false;render()}
function doLogout(){S.isOwner=false;S.key="";setkey("");const all=ls.get(REC,[]).filter(x=>x.src!=="sheet");ls.set(REC,all);S.sync={ok:null,msg:"",at:0,added:0,total:0};S.loginErr="";S.modal=null;render()}
let syncing=false;
function applyResults(r){const toks=[...new Set((r.codes||[]).filter(c=>typeof c==="string"))];let all=ls.get(REC,[]),add=0,bad=0,gone=0;
const before=all.length;all=all.filter(x=>x.src!=="sheet"||toks.includes(x.code));gone=before-all.length;
toks.forEach(t=>{const d=decodeCode(t);if(!d.ok){bad++;return}if(all.some(x=>x.rid===d.rec.rid))return;d.rec.code=t;d.rec.src="sheet";all.push(d.rec);add++});
ls.set(REC,all);S.sync={ok:true,at:Date.now(),added:add,total:toks.length,bad,msg:"",gone};return add+gone}
async function syncSheet(){if(syncing||!S.isOwner||!S.key)return;syncing=true;S.sync.msg="Syncing...";paintSync();
try{const r=await api({action:"results",key:S.key});
if(!r||!r.ok){S.isOwner=false;S.key="";setkey("");S.loginErr=(r&&r.error)||"Session expired. Sign in again.";S.sync={ok:null,msg:"",at:0,added:0,total:0};render(true);return}
const ch=applyResults(r);if(ch&&S.screen==="trainer"&&!S.modal&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||""))render(true)}
catch(e){S.sync.ok=false;S.sync.msg="Could not reach Google Sheets (will retry automatically). "+(e&&e.name==="AbortError"?"The request timed out.":"")}
finally{syncing=false;paintSync()}}
async function saveConfig(){const g=id=>$(id),c={preOpen:g("#cfg-pre").checked,postOpen:g("#cfg-post").checked,showExplanations:g("#cfg-ex").checked,allowRetake:g("#cfg-re").checked,benchmark:Number(g("#cfg-bench").value)};
const out=$("#cfgres");if(!(c.benchmark>=0&&c.benchmark<=100)){out.textContent="Benchmark must be 0 to 100.";return}
out.textContent="Saving...";
try{const r=await api({action:"setconfig",key:S.key,config:c});
if(r&&r.ok){Object.assign(CONFIG,r.config);const s=ls.get(SET,{});s.benchmark=r.config.benchmark;ls.set(SET,s);toast("Controls saved");render(true)}
else if(r&&/password|sign/i.test(r.error||"")){S.isOwner=false;S.loginErr=r.error;render()}
else out.textContent=(r&&r.error)||"Could not save."}
catch(e){out.textContent="Could not reach the server. Try again."}}

// ===== Trainer area =====
const records=()=>S.src==="demo"?ls.get(DEMO,[]):ls.get(REC,[]);
function view(){const f=S.f,q=f.q.toLowerCase();let g=group(records().filter(r=>!q||(r.n+" "+r.i).toLowerCase().includes(q)));if(f.status!=="all")g=g.filter(x=>statusOf(x)===f.status);
const ok=r=>r&&(f.type==="all"||r.type===f.type)&&pct(r)>=f.min&&pct(r)<=f.max;

function metrics(V){const L=V.L,B=bench(),pre=L.filter(x=>x.pre),post=L.filter(x=>x.post),both=L.filter(x=>x.pre&&x.post),ap=mean(pre.map(x=>pct(x.pre))),aq=mean(post.map(x=>pct(x.post))),ch=mean(both.map(x=>pct(x.post)-pct(x.pre)));

S.modal={title:name,html:`<p class="small">Direct download did not work in this browser. Copy the text below into a file named <b>${esc(name)}</b>.</p><textarea style="min-height:260px">${esc(text)}</textarea>`};render(true)}
const csvLearners=()=>{const V=view();return csv([["Name","Learner ID","Status","Pre %","Pre points","Pre submitted","Post %","Post points","Post submitted","Change (percentage points)","Matched by"]].concat(V.L.map(x=>[x.n,x.i,statusOf(x.full),x.pre?pct(x.pre):"",x.pre?x.pre.p+"/"+x.pre.m:"",x.pre?x.pre.s:"",x.post?pct(x.post):"",x.post?x.post.p+"/"+x.post.m:"",x.post?x.post.s:"",x.pre&&x.post?Math.round((pct(x.post)-pct(x.pre))*10)/10:"",x.pre&&x.post?(x.full.weak?"name":"id/name"):""])))};
const csvRecords=()=>csv([["Name","Learner ID","Assessment","Submitted","Points","Max","Percent","Correct","Incorrect","Unanswered","Seconds"].concat(DOM.map(d=>dname(d)+" %")).concat(["Question string (c/w/u in bank order)"])].concat(records().map(r=>[r.n,r.i,r.type,r.s,r.p,r.m,pct(r),r.c,r.w,r.u,r.d].concat(DOM.map(d=>r.tp[d][1]?Math.round(r.tp[d][0]/r.tp[d][1]*1000)/10:"")).concat([r.qs]))));
const csvBank=()=>csv([["Assessment","ID","Objective","Difficulty","Type","Question","Options","Correct answer","Explanation","Source"]].concat(["pre","post"].flatMap(t=>BANK[t].map(q=>[t,q.id,dname(q.d),q.df,q.t==="m"?"multiple":"single",q.q,q.o.join(" | "),correctTexts(q).join(" | "),expl(q.id),"Day "+q.d.slice(1)]))));

// ===== Demo data =====
function makeDemo(){const r=rng(20261012),names=["Adaeze N.","Bola A.","Chinedu E.","Dami O.","Efe I.","Funmi K.","Gbenga L.","Halima S.","Ify U.","Jide M.","Kemi B.","Lanre T.","Musa Y.","Ngozi C.","Obinna D.","Peace A.","Qudus R.","Rita F.","Sade W."],out=[],base=Date.now()-6*3600e3;
const gen=(type,ab)=>BANK[type].map(q=>{const p=Math.max(.05,Math.min(.97,ab/100+({B:.18,I:0,A:-.16}[q.df])+(r()-.5)*.3));return r()<p?"c":(r()<.06?"u":"w")}).join("");
names.forEach((n,k)=>{const L={name:"Demo "+n,lid:"DEMO-"+String(k+1).padStart(3,"0")},ab=38+r()*25,hasPre=k!==17,hasPost=k!==16&&k!==18||k===16;
if(hasPre){const t1=base+k*60e3;out.push(Object.assign(buildRecord("pre",L,gen("pre",ab),t1-1500e3,t1),{src:"demo"}))}
if(k!==16){const t1=base+3*3600e3+k*70e3;out.push(Object.assign(buildRecord("post",L,gen("post",ab+22+r()*12),t1-2400e3,t1),{src:"demo"}))}});
out.forEach((x,k)=>x.rid="demo"+k);return out}

// ===== Events =====
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-act]");if(!el)return;if(el.classList.contains("modal")&&ev.target.closest("[data-stop]"))return;const act=el.dataset.act,id=el.dataset.id;
const A={theme(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark"},
home(){S.screen="welcome";S.modal=null;render()},finish(){S.screen="welcome";S.attempt=null;S.result=null;S.name="";S.lid="";S.err="";render()},
trainer(){S.screen="trainer";S.tab="overview";render();syncSheet()},start,login(){doLogin()},logout(){doLogout()},saveconfig(){saveConfig()},retrysend(){S.result&&sendResult(S.result)},
"resume-yes"(){begin(S.resumeDraft)},"resume-no"(){ls.del(draftKey(S.resumeDraft));begin(newAttempt(S.type,{name:S.name.trim(),lid:normId(S.lid)}))},
prev(){S.attempt.idx=Math.max(0,S.attempt.idx-1);saveDraft();render()},next(){const a=S.attempt;a.idx=Math.min(a.order.length-1,a.idx+1);saveDraft();render()},
goto(){S.attempt.idx=+id;S.screen="assess";saveDraft();render()},
flag(){const a=S.attempt,q=curQ().id;a.flags=a.flags.includes(q)?a.flags.filter(x=>x!==q):[...a.flags,q];saveDraft();render(true)},
toreview(){S.confirm=false;S.screen="review";render()},backassess(){S.screen="assess";render()},confirmsubmit(){S.confirm=true;render(true)},cancelsubmit(){S.confirm=false;render(true)},submit,
exit(){saveDraft();S.attempt=null;S.screen="welcome";toast("Progress saved on this device");render()},
copycode(){const t=$("#codebox");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast("Code copied"),()=>toast(ok?"Code copied":"Select the code and copy it"));else toast(ok?"Code copied":"Select the code and copy it")},
print(){try{window.print()}catch(e){toast("Printing is blocked in this view. Open the page in a full browser tab to print.")}},
tab(){S.tab=id;render()},resetf(){S.f={type:"all",q:"",status:"all",min:0,max:100,topic:"all"};render(true)},
syncnow(){syncSheet()},learner(){learnerModal(id)},question(){questionModal(id)},mclose(){S.modal=null;render(true)},
csvlearners(){saveFile("psrm-learners.csv",csvLearners())},csvrecords(){saveFile("psrm-submissions.csv",csvRecords())},csvbank(){saveFile("psrm-question-bank.csv",csvBank())},
import(){const toks=($("#imp").value.match(/PSRM\.[A-Za-z0-9_\-]+\.[a-f0-9]+/g)||[]);let add=0,dup=0,bad=[];const all=ls.get(REC,[]);toks.forEach(t=>{const d=decodeCode(t);if(!d.ok){bad.push(d.err);return}if(all.some(r=>r.rid===d.rec.rid)){dup++;return}d.rec.code=t;all.push(d.rec);add++});ls.set(REC,all);
$("#impres").textContent=`Added ${add}, duplicates ignored ${dup}, invalid ${bad.length}${bad.length?" ("+[...new Set(bad)].join("; ")+")":""}`;if(!toks.length)$("#impres").textContent="No result codes found in the text.";if(add)toast(add+" result"+(add>1?"s":"")+" imported")},
savebench(){const v=Number($("#benchin").value);if(!(v>=0&&v<=100))return toast("Enter a value from 0 to 100");const s=ls.get(SET,{});s.benchmark=v;ls.set(SET,s);toast("Benchmark saved");render(true)},
loaddemo(){ls.set(DEMO,makeDemo());S.src="demo";toast("Demo data loaded");render(true)},
resetdemo(){ls.del(DEMO);toast("Demo data reset");render(true)},
clearreal(){if(confirm("Clear results cached on this browser? They will re-sync from the Google Sheet.")){ls.set(REC,[]);toast("Cache cleared");render(true);syncSheet()}}};
if(A[act]){ev.preventDefault();A[act]()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="pw"){ev.preventDefault();doLogin()}if(ev.key==="Escape"&&S.modal){S.modal=null;render(true)}if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("tr.cl")){ev.preventDefault();ev.target.click()}});
document.addEventListener("change",ev=>{const t=ev.target;if(t.name==="atype"){S.type=t.value;render(true)}else if(t.name==="ans"){pick(+t.dataset.k,t.checked)}
else if(t.id==="srcsel"){S.src=t.value;render(true)}else if(t.id==="qtsel"){S.qtype=t.value;render(true)}else if(t.id==="bts"){S.bankType=t.value;render(true)}else if(t.id==="btp"){S.bankTopic=t.value;render(true)}
else if(t.dataset&&t.dataset.f){const k=t.dataset.f;S.f[k]=(k==="min"||k==="max")?Math.max(0,Math.min(100,Number(t.value)||(k==="max"?100:0))):t.value;render(true)}});
document.addEventListener("input",ev=>{const t=ev.target;if(t.id==="fname")S.name=t.value;else if(t.id==="flid")S.lid=t.value;else if(t.dataset&&t.dataset.f==="q"){S.f.q=t.value;clearTimeout(input.h);input.h=setTimeout(()=>{render(true);const e=$("#fq");if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},350)}});
function input(){}
window.addEventListener("beforeunload",e=>{const a=S.attempt;if(S.screen==="assess"&&a&&a.status==="in_progress"&&answered(a)<a.order.length){e.preventDefault();e.returnValue=""}});
setInterval(()=>{const e=$("#elapsed");if(e)e.textContent=fmtT((Date.now()-S.t0)/1000)},1000);
(async()=>{loadRemoteConfig();if(skey()){S.loggingIn=true;doLogin(true)}else{S.ownerKnown=true;render(true)}})();
setInterval(()=>{if(S.screen==="trainer"&&S.isOwner)syncSheet()},30000);
render();
</script>
